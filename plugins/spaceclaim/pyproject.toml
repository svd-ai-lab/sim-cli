[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sim-plugin-spaceclaim"
version = "0.1.0"
description = "Ansys SpaceClaim skill package for CAD preparation workflows"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "svd-ai-lab" }]
keywords = ["spaceclaim", "ansys", "cad", "geometry", "simulation", "sim-cli", "plugin"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=8",
    "build>=1.0",
]

[project.entry-points."sim.skills"]
spaceclaim = "sim_plugin_spaceclaim:skills_dir"

[project.entry-points."sim.plugins"]
spaceclaim = "sim_plugin_spaceclaim:plugin_info"

[project.urls]
Homepage = "https://github.com/svd-ai-lab/sim-cli/tree/main/plugins/spaceclaim"
Repository = "https://github.com/svd-ai-lab/sim-cli/tree/main/plugins/spaceclaim"
Issues = "https://github.com/svd-ai-lab/sim-cli/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/sim_plugin_spaceclaim"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "sim_plugin_spaceclaim/_skills"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=.pytest-basetemp"
markers = [
  "integration: tests that build wheels or touch external tooling",
]
