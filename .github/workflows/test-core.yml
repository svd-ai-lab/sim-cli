name: Test core
on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/**"
      - "plugins/**"
      - "plugin-index.json"
      - ".github/workflows/test-core.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/**"
      - "plugins/**"
      - "plugin-index.json"
      - ".github/workflows/test-core.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --package sim-cli-core --group dev
      - run: uv run --no-sync python scripts/workspace.py test --package core
      - run: uv build --no-sources --package sim-cli-core
      - run: uv run --no-sync python scripts/workspace.py index --check
