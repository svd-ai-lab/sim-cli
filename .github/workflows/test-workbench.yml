name: Test workbench
on:
  pull_request:
    paths:
      - "plugins/workbench/**"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/**"
      - ".github/workflows/test-workbench.yml"
  push:
    branches: [main]
    paths:
      - "plugins/workbench/**"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/**"
      - ".github/workflows/test-workbench.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --package sim-plugin-workbench --group dev
      - run: uv run --no-sync python scripts/workspace.py test --package workbench
      - run: uv build --no-sources --package sim-plugin-workbench
